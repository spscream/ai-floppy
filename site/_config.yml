# Jekyll configuration for the documentation site.
#
# This file is not a site root: scripts/site-build.sh copies it, together with
# the Gemfile, into the assembled directory (.site/) next to the pages it
# generates from the repository's documents. Nothing here is served from the
# repository directly.
title: floppy
description: >-
  Session ritual for coding agents: durable git-committed memory, a start rite,
  a wrap rite, and the guards that keep them honest.
url: https://spscream.github.io
baseurl: /ai-floppy

theme: just-the-docs

# The README is one page with seventeen sections and the changelog is longer.
# Search over headings is the difference between a site and a wall of text.
search_enabled: true
search:
  heading_level: 3
  previews: 3
  tokenizer_separator: /[\s/]+/

heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  GitHub: https://github.com/spscream/ai-floppy
aux_links_new_tab: true

# "MIT licensed" alone stopped being true when the search grew its Russian
# stemmer: three vendored lunr-languages files are MPL-1.1, and a footer that
# names one licence for a page serving two is a small false statement of exactly
# the kind this repository keeps removing elsewhere.
footer_content: >-
  MIT licensed, except the vendored search plugins under
  <code>assets/js/vendor/</code>, which are MPL-1.1 — see the NOTICE beside
  them. The pages of this site are generated from the repository's own
  documents by <code>scripts/site-build.sh</code> — edit those, never a page.

# Sitemap and description tags. Nothing else is added to the built pages.
plugins:
  - jekyll-seo-tag
